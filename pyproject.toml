[project]
name = "mcp-easystore"
version = "0.1.0"
description = "EasyStore 電商平台的 MCP 伺服器：訂單、商品、顧客、營收查詢與寫入操作"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "easystore", "ecommerce", "claude"]

dependencies = [
    # 上限鎖在 2.0：mcp 2.x 把 FastMCP 更名為 MCPServer，import 路徑
    # mcp.server.fastmcp 已移除，本專案的程式仍是 v1 API。
    # 遷移指南：https://py.sdk.modelcontextprotocol.io/v2/migration/
    "mcp>=1.2,<2",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[project.urls]
Homepage = "https://github.com/AgendaLu/mcp-easystore"
Issues = "https://github.com/AgendaLu/mcp-easystore/issues"

[project.scripts]
mcp-easystore = "mcp_easystore.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_easystore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
